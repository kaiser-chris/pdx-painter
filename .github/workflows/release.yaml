name: Release

# Releases a new version, started by hand from the Actions tab:
#
#   1. works out the version from the latest release tag (0.1.0 when there is
#      none yet) and the part of it to increase,
#   2. vets and tests on Linux and Windows, and bundles the plugin with the
#      pdx-painter it runs for each, the version written into both,
#   3. tags the commit released and pushes the tag,
#   4. creates the GitHub release with the bundles attached.
#
# Nothing is tagged or published unless both builds pass. The tags start with
# a v, so that the tool can be installed with go install ...@v1.2.3.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Part of the version to increase
        type: choice
        options: [ patch, minor, major ]
        default: minor

permissions:
  contents: write

# Two releases at once would work out the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      previous-tag: ${{ steps.version.outputs.previous-tag }}
      next: ${{ steps.version.outputs.next }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not ${{ github.ref_name }}."
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          # The whole history, for the tags.
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: bash .github/scripts/next-version.sh "${{ inputs.increment }}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, binary: pdx-painter }
          - { runner: windows-latest, os: windows, binary: pdx-painter.exe }

    env:
      VERSION: ${{ needs.version.outputs.next }}
      ARCHIVE: pdx-painter_${{ needs.version.outputs.next }}_${{ matrix.os }}_amd64.zip
      # The tool is plain Go: without cgo it is linked statically, with no C
      # library or other shared library, so it runs on any Linux. On Windows
      # it loads only the system's own DLLs.
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13" # what Painter 2026 runs plugins with

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The plugin, with the tool next to it where it runs it from, laid out
      # as the folder that goes into Painter's plugin folder.
      - name: Build
        shell: bash
        run: |
          plugin="dist/PDX Painter"
          mkdir -p "$plugin/bin"
          cp "plugin/PDX Painter/"*.py "$plugin/"
          sed -i.bak -E "s/^VERSION = \"[^\"]*\"/VERSION = \"$VERSION\"/" "$plugin/core.py"
          rm "$plugin/core.py.bak"
          grep -q "^VERSION = \"$VERSION\"" "$plugin/core.py"

          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$plugin/bin/${{ matrix.binary }}" ./cmd/pdx-painter
          cp LICENSE README.md "$plugin/"

      - name: Check the tool is linked statically
        if: runner.os == 'Linux'
        run: |
          file "dist/PDX Painter/bin/${{ matrix.binary }}"
          file "dist/PDX Painter/bin/${{ matrix.binary }}" | grep -q "statically linked"

      - name: Test the plugin
        shell: bash
        run: |
          # The plugin's tests, run against the bundled tool.
          cp -r plugin/tests dist/tests
          python -m unittest discover -s dist/tests -v

          "dist/PDX Painter/bin/${{ matrix.binary }}" version | grep -q "\"$VERSION\""
          rm -rf dist/tests

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r "../$ARCHIVE" "PDX Painter" -x '*/__pycache__/*'

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive -Path "dist\PDX Painter" -DestinationPath $env:ARCHIVE

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: [ version, build ]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.version.outputs.next }}
      TAG: ${{ needs.version.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.version.outputs.previous-tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The history since the last release, for the release notes.
          fetch-depth: 0

      - name: Tag the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag --annotate "$TAG" --message "Release $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: pdx-painter_*
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: |
          # The commits that went into this release.
          if [ -n "$PREVIOUS_TAG" ]; then
            range="$PREVIOUS_TAG..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi

          {
            echo "Released a new version of **PDX Painter**."
            echo
            echo "Extract the \`PDX Painter\` folder of the zip for your system into Painter's plugin folder, see the [readme](https://github.com/${{ github.repository }}#installing)."
            echo "The command line tool alone: \`go install github.com/${{ github.repository }}/cmd/pdx-painter@$TAG\`"
            echo
            echo "### Changes"
            git log "$range" --no-merges --pretty=format:'- %s'
            echo
          } > notes.md

          cat notes.md

      - name: Create the release
        run: |
          gh release create "$TAG" dist/*.zip \
            --title "$VERSION" \
            --notes-file notes.md \
            --verify-tag
